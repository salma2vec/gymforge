name: write_bash_script
domain: terminal
description_template: "Write a bash script named '{script_name}' that {script_action} and make it executable"
difficulty_base: 0.5
slots:
  script_name:
    type: choice
    options: [cleanup.sh, backup.sh, process.sh, monitor.sh, setup.sh, report.sh]
  script_action:
    type: choice
    options:
      - "prints the sum of all integer arguments, or 0 if there are none"
scaffolding_template: "Empty workspace; agent must write the script from scratch"
success_criteria_template:
  exit_code: 0
  expected_file: "{script_name}"
